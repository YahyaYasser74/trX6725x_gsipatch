# ====================================================================
# UNISOC PLATFORM GNSS RE-TARGETING CONFIGURATION (LAYOUT ONE)
# ====================================================================

# 1. Target Time Synchronization Servers (NTP)
NTP_SERVER=pool.ntp.org
NTP_SERVER=0.android.pool.ntp.org
NTP_SERVER=1.android.pool.ntp.org

# 2. Assisted GPS (XTRA Data Feed Routing)
XTRA_SERVER_1=http://gpsonextra.net
XTRA_SERVER_2=http://gpsonextra.net
XTRA_SERVER_3=http://gpsonextra.net

# 3. Secure User-Plane Location (SUPL Connection Parameters)
SUPL_HOST=://google.com
SUPL_PORT=7275
SUPL_VER=0x20000
SUPL_MODE=1

# 4. Unisoc Core Hardware Engine Injection Flags
AGPS_CONFIG_INJECT=1
INTERM_POS_MIN_TIME=1000
GPS_LOCK=0
A_GLONASS_POS_COMBINE_MASK=0xF

# 5. Device Frame Pipeline Bridges (Bypasses Non-Framework Checks)
NFW_PROXY_APPS=com.spreadtrum.proxy.nfwlocation
CAPABILITIES=0x37
